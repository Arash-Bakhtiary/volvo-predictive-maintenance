[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "volvo-predictive-maintenance"
version = "0.1.0"
description = "Volvo Bus Predictive Maintenance POC — Databricks"
requires-python = ">=3.10"
dependencies = [
    "faker>=40.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "xgboost>=2.0.0",
    "mlflow>=2.10.0",
    "scikit-learn>=1.3.0",
    "imbalanced-learn>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pyspark>=3.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
