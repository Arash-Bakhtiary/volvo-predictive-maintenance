resources:
  jobs:
    volvo_poc_pipeline:
      name: "[${bundle.target}] Volvo POC — Full Medallion Pipeline"
      description: "End-to-end pipeline: data gen → Unity Catalog → bronze → silver → gold → ML"

      tags:
        project: volvo-poc
        team: data-engineering

      tasks:
        - task_key: data_generation
          description: "Generate 1M rows of synthetic bus telemetry into UC Volume"
          notebook_task:
            notebook_path: /Workspace/Users/decarboniccodes@gmail.com/volvo-predictive-maintenance/notebooks/00_data_generation
            base_parameters:
              catalog: ${var.catalog}

        - task_key: unity_catalog_setup
          description: "Create catalog, schemas, column masks, row filters, grants"
          depends_on:
            - task_key: data_generation
          notebook_task:
            notebook_path: /Workspace/Users/decarboniccodes@gmail.com/volvo-predictive-maintenance/notebooks/01_unity_catalog_setup
            base_parameters:
              catalog: ${var.catalog}

        - task_key: bronze_ingestion
          description: "Ingest raw CSVs from UC Volume into Delta bronze table"
          depends_on:
            - task_key: unity_catalog_setup
          notebook_task:
            notebook_path: /Workspace/Users/decarboniccodes@gmail.com/volvo-predictive-maintenance/notebooks/02_bronze_ingestion
            base_parameters:
              catalog: ${var.catalog}

        - task_key: silver_curation
          description: "Cleanse, validate, PII-mask, write Silver layer"
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            notebook_path: /Workspace/Users/decarboniccodes@gmail.com/volvo-predictive-maintenance/notebooks/03_silver_curation
            base_parameters:
              catalog: ${var.catalog}

        - task_key: gold_features
          description: "Feature engineering — wear indices, composite risk score"
          depends_on:
            - task_key: silver_curation
          notebook_task:
            notebook_path: /Workspace/Users/decarboniccodes@gmail.com/volvo-predictive-maintenance/notebooks/04_gold_features
            base_parameters:
              catalog: ${var.catalog}

        - task_key: ml_training
          description: "Train XGBoost, log to MLflow, register model"
          depends_on:
            - task_key: gold_features
          notebook_task:
            notebook_path: /Workspace/Users/decarboniccodes@gmail.com/volvo-predictive-maintenance/notebooks/05_ml_training
            base_parameters:
              catalog: ${var.catalog}
              experiment_name: /Users/decarboniccodes@gmail.com/volvo-poc-failure-predictor

      email_notifications:
        on_failure:
          - decarboniccodes@gmail.com
        on_success:
          - decarboniccodes@gmail.com
